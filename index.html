<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
// 百度统计事件埋点：用于观察真实用户行为
function trackEvent(category, action, label, value) {
  try {
    if (window._hmt) {
      window._hmt.push(['_trackEvent', category, action, label || '', value || 0]);
    }
  } catch (e) {
    console.warn('百度统计事件发送失败', e);
  }
}

const TENCENT_SURVEY_URL = 'https://wj.qq.com/s2/26593191/2c8e/';
const ITINERARY_STORAGE_KEY = "currentItinerary";
const ITINERARY_PAYMENTS_KEY = "paidItineraries";
const ITINERARY_TTL_MS = 7 * 24 * 60 * 60 * 1000;
const MY_TRIPS_STORAGE_KEY = "myTrips";
const MY_TRIPS_MAX_COUNT = 20;

function createItineraryId() {
  if (window.crypto && window.crypto.randomUUID) {
    return window.crypto.randomUUID();
  }
  return `itinerary-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
}

function safeReadJson(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    return JSON.parse(raw);
  } catch (e) {
    console.warn(`localStorage 数据损坏，已忽略：${key}`, e);
    localStorage.removeItem(key);
    return fallback;
  }
}

function getStoredItinerary() {
  const itinerary = safeReadJson(ITINERARY_STORAGE_KEY, null);
  if (!itinerary || typeof itinerary !== "object") return null;
  if (!itinerary.id || typeof itinerary.id !== "string") return null;
  if (!itinerary.outputHTML || typeof itinerary.outputHTML !== "string") return null;
  if (typeof itinerary.createdAt !== "number" || typeof itinerary.expiresAt !== "number") return null;
  if (Date.now() > itinerary.expiresAt) {
    localStorage.removeItem(ITINERARY_STORAGE_KEY);
    return null;
  }
  return itinerary;
}

function saveItinerary(userInput, outputHTML) {
  const now = Date.now();
  const itinerary = {
    id: createItineraryId(),
    input: userInput,
    outputHTML: outputHTML,
    createdAt: now,
    expiresAt: now + ITINERARY_TTL_MS
  };
  localStorage.setItem(ITINERARY_STORAGE_KEY, JSON.stringify(itinerary));
  localStorage.setItem("hasGenerated", "true");
  return itinerary;
}

function getMyTrips() {
  const trips = safeReadJson(MY_TRIPS_STORAGE_KEY, []);
  if (!Array.isArray(trips)) return [];

  return trips
    .filter(trip => trip && typeof trip === "object" &&
      typeof trip.id === "string" &&
      typeof trip.title === "string" &&
      typeof trip.input === "string" &&
      typeof trip.outputHTML === "string" &&
      typeof trip.createdAt === "number")
    .sort((a, b) => b.createdAt - a.createdAt)
    .slice(0, MY_TRIPS_MAX_COUNT);
}

function saveTripToHistory(userInput, outputHTML) {
  const trip = {
    id: createItineraryId(),
    title: userInput.slice(0, 30),
    input: userInput,
    outputHTML: outputHTML,
    createdAt: Date.now()
  };

  const trips = [trip, ...getMyTrips()].slice(0, MY_TRIPS_MAX_COUNT);
  localStorage.setItem(MY_TRIPS_STORAGE_KEY, JSON.stringify(trips));
  renderMyTrips();
  return trip;
}

function deleteTripFromHistory(id) {
  const trip = getMyTrips().find(item => item.id === id);
  if (!trip) return;

  if (!window.confirm(`确定删除“${trip.title}”吗？`)) return;

  const remainingTrips = getMyTrips().filter(item => item.id !== id);
  localStorage.setItem(MY_TRIPS_STORAGE_KEY, JSON.stringify(remainingTrips));
  renderMyTrips();
  trackEvent('my_trips', 'delete', 'single_trip');
}

function clearAllTrips() {
  if (getMyTrips().length === 0) return;
  if (!window.confirm("确定清空全部旅行吗？此操作无法撤销。")) return;

  localStorage.removeItem(MY_TRIPS_STORAGE_KEY);
  renderMyTrips();
  trackEvent('my_trips', 'delete', 'all_trips');
}

function renderMyTrips() {
  const container = document.getElementById("myTripsContent");
  if (!container) return;

  const trips = getMyTrips();
  container.innerHTML = "";

  if (trips.length === 0) {
    const emptyMessage = document.createElement("p");
    emptyMessage.className = "my-trips-empty";
    emptyMessage.innerHTML = "还没有保存的旅行计划<br>生成一次旅行后，它会自动保存在这里。";
    container.appendChild(emptyMessage);
    return;
  }

  const list = document.createElement("ul");
  list.className = "my-trips-list";

  trips.forEach(trip => {
    const item = document.createElement("li");
    const row = document.createElement("div");
    const button = document.createElement("button");
    const deleteButton = document.createElement("button");
    const title = document.createElement("strong");
    const date = document.createElement("span");

    row.className = "my-trip-row";

    button.type = "button";
    button.className = "my-trip-item";
    button.addEventListener("click", () => loadTripFromHistory(trip.id));

    deleteButton.type = "button";
    deleteButton.className = "my-trip-delete";
    deleteButton.setAttribute("aria-label", `删除 ${trip.title}`);
    deleteButton.title = "删除这次旅行";
    deleteButton.textContent = "🗑️";
    deleteButton.addEventListener("click", () => deleteTripFromHistory(trip.id));

    title.textContent = trip.title;
    date.className = "my-trip-date";
    date.textContent = new Date(trip.createdAt).toLocaleString("zh-CN");

    button.append(title, date);
    row.append(button, deleteButton);
    item.appendChild(row);
    list.appendChild(item);
  });

  const clearButton = document.createElement("button");
  clearButton.type = "button";
  clearButton.className = "my-trips-clear";
  clearButton.textContent = "清空全部旅行";
  clearButton.addEventListener("click", clearAllTrips);

  container.append(list, clearButton);
}

function loadTripFromHistory(id) {
  const trip = getMyTrips().find(item => item.id === id);
  if (!trip) return;

  document.getElementById("inputText").value = trip.input;
  document.getElementById("output").innerHTML = trip.outputHTML;
  saveItinerary(trip.input, trip.outputHTML);
  localStorage.setItem("pdfPaid", "true");
  updateButtonDisplayAfterGenerate();
  document.getElementById("pdf-content").scrollIntoView({ behavior: "smooth" });
}

// 保留旧支付状态数据结构，方便未来恢复付费模式。
function getPaidItineraries() {
  const paidItineraries = safeReadJson(ITINERARY_PAYMENTS_KEY, {});
  if (!paidItineraries || typeof paidItineraries !== "object" || Array.isArray(paidItineraries)) {
    return {};
  }
  return paidItineraries;
}

function isCurrentItineraryPaid() {
  const itinerary = getStoredItinerary();
  if (!itinerary) return false;
  const paidItineraries = getPaidItineraries();
  return Boolean(paidItineraries[itinerary.id] && paidItineraries[itinerary.id].paid === true);
}

function markCurrentItineraryPaid(orderNumber) {
  const itinerary = getStoredItinerary();
  if (!itinerary) return false;
  const paidItineraries = getPaidItineraries();
  paidItineraries[itinerary.id] = {
    paid: true,
    orderNumber: orderNumber,
    paidAt: Date.now()
  };
  localStorage.setItem(ITINERARY_PAYMENTS_KEY, JSON.stringify(paidItineraries));
  localStorage.setItem("pdfPaid", "true");
  return true;
}

function openTencentSurvey() {
  trackEvent('feedback', 'open', 'tencent_survey_footer');
  window.open(TENCENT_SURVEY_URL, '_blank');
}
</script>

<script>
async function generate() {
  const userInput = document.getElementById('inputText').value.trim();

  if (!userInput) {
    alert("⚠️ 请输入您的旅行需求");
    trackEvent('generate', 'error', 'empty_input');
    return;
  }

  trackEvent('button', 'click', 'generate_trip');

  const output = document.getElementById('output');
  const pdfButton = document.getElementById('pdfButton');
  const generateBtn = document.getElementById('generateBtn');

  output.innerHTML = `<div class="loading-road">⏳ AI正在生成行程，请稍等 <span id="roadTrack">🚗</span></div>`;
  pdfButton.style.display = 'none';
  localStorage.removeItem(ITINERARY_STORAGE_KEY);
  localStorage.setItem("hasGenerated", "false");
  localStorage.setItem("pdfPaid", "false");
  generateBtn.disabled = true;
  generateBtn.innerText = "📝️ AI生成中…";

  const prompt = `
你是一位专业的中文旅行规划师，请根据下方旅行需求，制定详细的旅行行程：
${userInput}

请提供每天的活动安排，并以 Markdown 表格输出。
表格必须为5列：日期、行程内容、交通工具、餐食推荐、住宿推荐（不要增加或减少列）。
要求内容结构清晰、语言自然，加入适量 emoji 图标增强可读性。

每天行程的住宿安排推荐具体的真实存在的酒店或旅馆名称。
请列出预算汇总和预约清单。
`;

  try {
    const response = await fetch("https://deepseek-proxy-three.vercel.app/api/deepseek", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: "deepseek-chat",
        messages: [
          { role: "system", content: "你是一位专业中文旅行规划师" },
          { role: "user", content: prompt }
        ],
        temperature: 0.7
      })
    });

    const data = await response.json();

    if (data && data.choices && data.choices.length > 0) {
      const parsedHtml = marked.parse(data.choices[0].message.content.trim());
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = parsedHtml;

      const children = Array.from(tempDiv.children);
      let outputHTML = '';
      let currentBlock = [];

      children.forEach(child => {
        if (/^day\s*\d+/i.test(child.textContent.trim().toLowerCase()) || /第\s*\d+\s*天/.test(child.textContent.trim())) {
          if (currentBlock.length > 0) {
            outputHTML += '<div class="day-plan">' + currentBlock.map(el => el.outerHTML).join('') + '</div>';
            currentBlock = [];
          }
        }
        currentBlock.push(child);
      });

      if (currentBlock.length > 0) {
        outputHTML += '<div class="day-plan">' + currentBlock.map(el => el.outerHTML).join('') + '</div>';
      }

      output.innerHTML = outputHTML;
      saveItinerary(userInput, outputHTML);
      saveTripToHistory(userInput, outputHTML);
      trackEvent('generate', 'success', 'trip_plan');

      document.getElementById("pdf-content").scrollIntoView({ behavior: "smooth" });

    } else {
      output.innerText = "⚠️ AI未返回有效内容，请稍后再试。";
      trackEvent('generate', 'error', 'empty_ai_response');
    }
  } catch (error) {
    console.error("Error:", error);
    output.innerText = "❌ AI请求出错，请检查网络连接或请勿息屏，重新点击生成行程。";
    trackEvent('generate', 'error', 'request_failed');
    localStorage.setItem("hasGenerated", "false");
  } finally {
    generateBtn.disabled = false;
    generateBtn.innerText = "📖️ AI生成旅游行程";
    updateButtonDisplayAfterGenerate();
  }
}
</script>

<script>
// 付费模式保留在代码中，当前MVP不调用。
function unlockPDF() {
  trackEvent('payment', 'click', 'confirm_paid');
  const modal = document.getElementById("confirmModal");
  if (!modal) return;
  document.getElementById("orderNumberInput").value = "";
  modal.style.display = "flex";
}

function onConfirmPay(paid) {
  const modal = document.getElementById("confirmModal");
  const paywall = document.getElementById("paywall");
  const orderError = document.getElementById("orderError");
  if (!modal || !paywall || !orderError) return;

  orderError.style.display = "none";

  if (!paid) {
    modal.style.display = "none";
    paywall.style.display = "block";
    paywall.scrollIntoView({ behavior: "smooth" });
    return;
  }

  const orderNumber = document.getElementById("orderNumberInput").value.trim();

  if (!orderNumber) {
    alert("⚠️ 请输入或复制微信支付的转账单号");
    trackEvent('payment', 'error', 'empty_order_number');
    return;
  }

  const regex = /^\d{10}(20\d{2}(0[1-9]|1[0-2])([0-2]\d|3[01]))\d*$/;

  if (!regex.test(orderNumber)) {
    orderError.style.display = "block";
    trackEvent('payment', 'error', 'invalid_order_number');
    return;
  }

  const lastOrder = localStorage.getItem("lastOrderNumber");

  if (orderNumber === lastOrder && lastOrder) {
    alert("⚠️ 此订单号已使用，请勿重复提交！");
    trackEvent('payment', 'error', 'duplicate_order_number');
    return;
  }

  if (!markCurrentItineraryPaid(orderNumber)) {
    alert("⚠️ 未找到可绑定的行程，请先生成行程后再确认支付。");
    trackEvent('payment', 'error', 'missing_itinerary');
    return;
  }

  localStorage.setItem("lastOrderNumber", orderNumber);
  modal.style.display = "none";
  trackEvent('payment', 'success', 'order_verified');

  const btn = document.getElementById('unlockButton');
  if (btn) btn.innerHTML = '<span>✅</span> 已支付，下载行程PDF';

  const downloadBtn = document.getElementById('pdfButton');
  downloadBtn.style.display = 'inline-block';

  paywall.style.display = "none";
  paywall.scrollIntoView({ behavior: "smooth" });
}
</script>

<script>
// 当前MVP：PDF免费下载，点击后直接导出，不再经过支付墙。
function doDownloadPDF() {
  trackEvent('button', 'click', 'download_pdf');
  return exportPDF();
}

// PDF下载函数
function exportPDF() {
  const element = document.getElementById("pdf-content");
  const pdfButton = document.getElementById("pdfButton");
  const originalButtonHTML = pdfButton.innerHTML;

  pdfButton.disabled = true;
  pdfButton.innerHTML = "⏳ 正在生成PDF...";
  element.classList.add("pdf-export");

  // ✅ 使用用户输入作为PDF文件名
  let userInput = document.getElementById("inputText").value.trim();
  let filename = "旅行行程.pdf";

  if (userInput) {
    const cleaned = userInput.replace(/[^\u4e00-\u9fa5\w]+/g, "").slice(0, 30);
    if (cleaned) {
      filename = `${cleaned}.pdf`;
    }
  }

  const opt = {
    margin: 0.5,
    filename: filename,
    image: { type: "jpeg", quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, scrollY: 0 },
    jsPDF: { unit: "in", format: "a4", orientation: "portrait" }
  };

  return html2pdf().set(opt).from(element).save().then(() => {
    trackPDFDownload();
  }).catch((error) => {
    console.error("PDF下载失败", error);
    alert("❌ PDF下载失败，请稍后重试，或检查浏览器是否阻止了下载。");
    trackEvent('download', 'error', 'pdf_export_failed');
  }).finally(() => {
    element.classList.remove("pdf-export");
    pdfButton.disabled = false;
    pdfButton.innerHTML = originalButtonHTML;
  });
}
</script>

<script>
let carPosition = 0;
let direction = 1;
let maxSteps = 8;
let intervalId;

function updateRoadTrack() {
  const car = document.getElementById("roadTrack");
  if (!car) return;

  carPosition += direction;

  if (carPosition >= maxSteps || carPosition <= 0) {
    direction *= -1;
  }

  const dots = ".".repeat(carPosition);
  const emoji = "🚗";
  car.innerHTML = dots + emoji;
}

const observer = new MutationObserver(() => {
  const car = document.getElementById("roadTrack");
  if (car && !intervalId) {
    intervalId = setInterval(updateRoadTrack, 200);
  }
});

observer.observe(document.body, { childList: true, subtree: true });
</script>
